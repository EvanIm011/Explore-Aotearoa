
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Aotearoa - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="lake-wanaka-tree">
    <!-- Header Section With Logo and Navbar -->
    <header>
        <a href="index.html" class="logo">Explore!</a>
        <!-- Navbar with other Pages -->
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!-- Main section-->
    <main class="contact-main">
        <!-- Sends Information in Contact Form to FormSubmit.co -->
        <form action="https://formsubmit.co/033bf0ffbe1e9413863b65c87936b670"
              method="POST">
            <!-- Heading for Contact Page -->
            <div>
                <h1 style="color: white;">Contact Us!</h1>
            </div>
            <!-- Input for First and Last Name-->
            <div class="top">
                <label for="name">First Name:</label>
                <input type="text" id="first-name" name="first-name" required>

                <label for="name">Last Name:</label>
                <input type="text" id="last-name" name="last-name" required>
            </div>
            <!-- Input for email adress -->
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <!-- Input for Message -->
            <div>
                <label for="Message">Leave a Message:</label>
                <textarea id="message" name="message" name="email"
                          rows="4" cols="50"></textarea>
            </div>
            <!-- Reset and Submit buttomns -->
            <div>
                <input type="reset" id="reset">
                <br>
                <button type="submit">Send</button>
            </div>

        </form>
        <!-- Section with Email Adress -->
        <div class="email-me">
            <h1>Email Me!</h1>

            <a href="mailto:25768@lbc.school.nz"
               style="font-size: larger;">25768@lbc.school.nz</a>
        </div>

    </main>
    <!-- Footer Section with Copyright and other pages -->
    <footer>
        ©2026 All Rights Reserved <br>
    <a href="index.html">Home</a> <a href="about.html">About</a> <a href="contact.html">Contact</a>

    </footer>

</body>
</html>
